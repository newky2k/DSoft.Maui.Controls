# Release: on every push to main, builds Release and pushes the DSoft.*.nupkg
# packages to nuget.org as 2.0.yyMM.<run number>. The commit is tagged
# v<version> before anything is published, then a GitHub release is created
# for that tag with the packages attached.
# RELEASE_SUFFIX is empty for a stable version; set it to a suffix such as
# '-prerelease' to publish a prerelease.
# Signs in to nuget.org with Trusted Publishing (OIDC), so no API key is stored.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_SUFFIX: ''

jobs:
  release:
    runs-on: windows-latest
    environment: nuget
    permissions:
      contents: write # GitHub release and tag
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Version
        id: version
        shell: bash
        run: |
          version="2.0.$(date -u +%y%m).${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package=$version$RELEASE_SUFFIX" >> "$GITHUB_OUTPUT"
          echo "Version: $version$RELEASE_SUFFIX"

      - name: Install MAUI workloads
        run: dotnet workload restore DSoft.MAUI.Controls.slnx

      - name: Restore
        run: dotnet restore DSoft.MAUI.Controls.slnx /p:Configuration=Release /p:Platform="Any CPU"

      - name: Build
        run: >
          dotnet build DSoft.MAUI.Controls.slnx --configuration Release --no-restore
          /p:Platform="Any CPU"
          /p:Version=${{ steps.version.outputs.package }}
          /p:AssemblyVersion=${{ steps.version.outputs.version }}
          /p:FileVersion=${{ steps.version.outputs.version }}

      - name: Collect packages
        shell: bash
        run: |
          mkdir -p artifacts
          find DSoft.MAUI.Controls DSoft.Maui.Controls.Core -path '*/bin/Release/*' -name 'DSoft.*.nupkg' -exec cp {} artifacts/ \;
          ls artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: drop
          path: artifacts/*.nupkg

      # Tag before publishing so every package on nuget.org has a matching tag.
      # A re-run of the same run reuses its tag; a tag on another commit fails
      # the job before anything is published.
      - name: Tag
        shell: bash
        run: |
          tag="v${{ steps.version.outputs.package }}"
          existing=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          if [ -z "$existing" ]; then
            git tag "$tag" "${{ github.sha }}"
            git push origin "$tag"
          elif [ "$existing" != "${{ github.sha }}" ]; then
            echo "::error::Tag $tag already exists on $existing, not ${{ github.sha }}"
            exit 1
          else
            echo "Tag $tag already exists on this commit"
          fi

      - name: NuGet login
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        shell: bash
        run: |
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.package }}" artifacts/*.nupkg \
            --verify-tag \
            --title "${{ steps.version.outputs.package }}" \
            --generate-notes \
            ${RELEASE_SUFFIX:+--prerelease}
